<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GradeGap — SGC vs PSA</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
</head>
<body>
  <header>
    <div class="title">
      <h1>GradeGap</h1>
      <span class="subtitle">SGC vs PSA price disparity — grades 10 &amp; 9</span>
    </div>
    <div class="sync">
      <span id="sync-info" class="sync-info"></span>
      <button id="resume-btn" class="secondary" hidden>Resume interrupted sync</button>
      <button id="sync-btn">Sync</button>
      <button id="cancel-btn" class="secondary" hidden>Cancel</button>
    </div>
  </header>

  <div id="progress" class="progress" hidden>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <span id="progress-text"></span>
  </div>

  <div id="error-banner" class="error-banner" hidden></div>

  <section class="controls">
    <div class="control">
      <label>Price basis</label>
      <div class="toggle" id="basis-toggle">
        <button data-value="cl_value" class="active">CL Value</button>
        <button data-value="last_sale">Last Sale</button>
      </div>
    </div>
    <div class="control">
      <label>Grade</label>
      <div class="checks" id="grade-filter">
        <label><input type="checkbox" data-grade="10" checked /> 10</label>
        <label><input type="checkbox" data-grade="9" checked /> 9</label>
      </div>
    </div>
    <div class="control">
      <label>Liquidity</label>
      <div class="checks" id="color-filter">
        <label><input type="checkbox" data-color="green" checked /> <i class="dot dot-green"></i> Green</label>
        <label><input type="checkbox" data-color="yellow" checked /> <i class="dot dot-yellow"></i> Yellow</label>
        <label><input type="checkbox" data-color="red" checked /> <i class="dot dot-red"></i> Red</label>
        <label><input type="checkbox" data-color="gray" checked /> <i class="dot dot-gray"></i> Other</label>
      </div>
    </div>
    <div class="control">
      <label for="grader">Grader</label>
      <select id="grader" title="Grader compared against PSA (PSA is always the higher-priced side)">
        <option value="SGC">SGC</option>
      </select>
    </div>
    <div class="control">
      <label for="min-price">Min SGC 10 price ($)</label>
      <input type="number" id="min-price" min="0" step="50" value="0" />
    </div>
    <div class="control">
      <label for="min-diff">Min $ Diff ($)</label>
      <input type="number" id="min-diff" min="0" step="50" value="0" title="Only show cards whose SGC↔PSA gap is at least this many dollars" />
    </div>
    <div class="control">
      <label for="player">Player</label>
      <select id="player"><option value="">All players</option></select>
    </div>
  </section>

  <main>
    <div class="summary-row">
      <p id="summary" class="summary"></p>
      <div class="legend">
        <span><i class="dot dot-green"></i> both &lt;3mo</span>
        <span><i class="dot dot-yellow"></i> both &gt;12mo</span>
        <span><i class="dot dot-red"></i> SGC &gt;3mo &amp; PSA &lt;3mo</span>
        <span><i class="dot dot-gray"></i> other</span>
      </div>
    </div>
    <table id="results">
      <thead>
        <tr>
          <th class="dot-col sortable" data-col="color" data-type="color" title="Liquidity — how recently each side last sold — click to sort"><span class="hcell"><span class="arrow"></span></span></th>
          <th class="sortable" data-col="name" data-type="text"><span class="hcell">Card<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="grade" data-type="num"><span class="hcell">Grade<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="sgc_price" data-type="num"><span class="hcell">SGC<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="psa_price" data-type="num"><span class="hcell">PSA<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="abs_diff" data-type="num"><span class="hcell">$ Diff<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="pct_diff" data-type="num"><span class="hcell">% Diff<span class="arrow"></span></span></th>
          <th class="sortable" data-col="sgc_last_sale_date" data-type="date"><span class="hcell">SGC last sale<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="sgc_sales" data-type="num"><span class="hcell">SGC Sales No<span class="arrow"></span></span></th>
          <th class="sortable" data-col="psa_last_sale_date" data-type="date"><span class="hcell">PSA last sale<span class="arrow"></span></span></th>
          <th class="num sortable" data-col="psa_sales" data-type="num"><span class="hcell">PSA Sales No<span class="arrow"></span></span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <!-- Message text is owned by renderResults() in app.js. -->
    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
